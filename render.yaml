services:
  - type: web
    name: heaven-furniture-api
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: FRONTEND_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
  - type: static_site
    name: heaven-furniture
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false